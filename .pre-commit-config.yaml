repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        types_or: [python]

      - id: conventional-commit-msg
        name: conventional-commit-msg
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
