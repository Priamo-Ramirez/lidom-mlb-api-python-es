[project]
name = "lidom-mlb-api-guide"
version = "0.1.0"
description = "Guia en Python y cliente auxiliar para datos LIDOM en MLB Stats API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cursor Agent" }
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[project.scripts]
lidom-api = "lidom_mlb_api.cli:main"

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["PYI034"]
